version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "staging"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "type:chore"]
    groups:
      gradle-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "area:ci"]
